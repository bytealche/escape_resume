<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESUME</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='static/assets/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressBar" style="width: 33.33%;"></div>
  </div>

  <div class="game-container">
    <div class="level-screen">
      <div class="level-header">
        <div class="level-title">Level 2: Caesar Cipher</div>
        <div class="timer" id="timer">5:00</div>
      </div>
      
      <p style="margin: 20px 0;">The candidate's role is encrypted with a Caesar cipher (shift +3):</p>
      
      <div class="code-puzzle">
        VRIWZDUH GHYHORSHU
      </div>

      <div class="input-group">
        <input type="text" id="roleInput" placeholder="Decrypted role...">
        <button class="action-btn" onclick="checkAnswer()">Submit</button>
      </div>

      <button class="hint-btn" onclick="showHint()">💡 Request Hint (Cost: 5s)</button>
      <div id="result"></div>
      
      <a href="{{ url_for('level', num=1) }}" class="back-link">← Previous Level</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    generateStars();
    startTimer(300);

    function showHint() {
      useHint('Shift each letter back by 3 positions in the alphabet. For example: D→A, E→B, F→C, etc.');
    }

    function checkAnswer() {
      const input = document.getElementById('roleInput').value.trim().toLowerCase();
      if(input === 'software developer' || input === 'softwaredeveloper') {
        saveProgress(2);
        document.getElementById('result').innerHTML = `
          <div class="result-box">
            <div class="success">✅ CIPHER CRACKED</div>
            <div class="resume-section">
              <h3>Role Profile Unlocked</h3>
              <p><strong>Current Role:</strong> Software Developer</p>
              <p><strong>Specialization:</strong> Full Stack Development</p>
              <p><strong>Focus Areas:</strong> Web Applications, API Design, Cloud Architecture</p>
              <p><strong>Years of Experience:</strong> 5+ years</p>
            </div>
            <a href="{{ url_for('level', num=3) }}" class="action-btn" style="display: inline-block; margin-top: 20px; text-decoration: none;">
              Proceed to Level 3 →
            </a>
          </div>
        `;
      } else {
        document.getElementById('result').innerHTML = `
          <div class="result-box"><div class="error">❌ Decryption failed. Check your cipher shift.</div></div>
        `;
      }
    }
  </script>
</body>
</html>
