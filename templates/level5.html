<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESUME</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='static/assets/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressBar" style="width: 83.33%;"></div>
  </div>

  <div class="game-container">
    <div class="level-screen">
      <div class="level-header">
        <div class="level-title">Level 5: Skills Assessment</div>
        <div class="timer" id="timer">5:00</div>
      </div>
      
      <p style="margin: 20px 0;">Select ALL skills the candidate possesses (click to select/deselect):</p>
      
      <div class="choice-grid">
        <div class="choice-btn" onclick="toggleChoice(this, 'Python')">Python</div>
        <div class="choice-btn" onclick="toggleChoice(this, 'JavaScript')">JavaScript</div>
        <div class="choice-btn" onclick="toggleChoice(this, 'React')">React</div>
        <div class="choice-btn" onclick="toggleChoice(this, 'PHP')">PHP</div>
        <div class="choice-btn" onclick="toggleChoice(this, 'SQL')">SQL</div>
        <div class="choice-btn" onclick="toggleChoice(this, 'Ruby')">Ruby</div>
        <div class="choice-btn" onclick="toggleChoice(this, 'Docker')">Docker</div>
        <div class="choice-btn" onclick="toggleChoice(this, 'Perl')">Perl</div>
      </div>

      <button class="action-btn" style="margin-top: 20px;" onclick="checkAnswer()">Verify Selection</button>
      <button class="hint-btn" onclick="showHint()">💡 Request Hint (Cost: 5s)</button>
      <div id="result"></div>
      
      <a href="{{ url_for('level', num=4) }}" class="back-link">← Previous Level</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    generateStars();
    startTimer(300);

    let selectedSkills = new Set();

    function toggleChoice(btn, skill) {
      if(selectedSkills.has(skill)) {
        selectedSkills.delete(skill);
        btn.style.background = 'rgba(255,255,255,0.05)';
        btn.style.borderColor = 'rgba(255,255,255,0.1)';
      } else {
        selectedSkills.add(skill);
        btn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        btn.style.borderColor = '#667eea';
      }
    }

    function showHint() {
      useHint('Focus on modern web development technologies. Look for languages, frameworks, and tools commonly used in full-stack development.');
    }

    function checkAnswer() {
      const correct = new Set(['Python', 'JavaScript', 'React', 'SQL', 'Docker']);
      const isCorrect = selectedSkills.size === correct.size && 
        [...selectedSkills].every(s => correct.has(s));
      
      if(isCorrect) {
        saveProgress(5);
        document.getElementById('result').innerHTML = `
          <div class="result-box">
            <div class="success">✅ SKILLS VALIDATED</div>
            <div class="resume-section">
              <h3>Technical Expertise Unlocked</h3>
              <p><strong>Languages:</strong></p>
              <p style="margin-left: 20px; color: #a0aec0;">Python (Expert) • JavaScript (Expert) • TypeScript (Advanced) • Java (Intermediate)</p>
              
              <p><strong>Frameworks & Libraries:</strong></p>
              <p style="margin-left: 20px; color: #a0aec0;">React • Node.js • Django • Flask • Express.js • Vue.js</p>
              
              <p><strong>Databases:</strong></p>
              <p style="margin-left: 20px; color: #a0aec0;">PostgreSQL • MongoDB • MySQL • Redis • Elasticsearch</p>
              
              <p><strong>DevOps & Tools:</strong></p>
              <p style="margin-left: 20px; color: #a0aec0;">Docker • Kubernetes • AWS • Git • CI/CD • Jenkins • Terraform</p>
            </div>
            <a href="{{ url_for('level', num=6) }}" class="action-btn" style="display: inline-block; margin-top: 20px; text-decoration: none;">
              Proceed to Final Level →
            </a>
          </div>
        `;
      } else {
        document.getElementById('result').innerHTML = `
          <div class="result-box"><div class="error">❌ Incorrect selection. You have ${selectedSkills.size} selected, need exactly 5 correct skills.</div></div>
        `;
      }
    }
  </script>
</body>
</html>
