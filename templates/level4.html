<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESUME</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='static/assets/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressBar" style="width: 66.67%;"></div>
  </div>

  <div class="game-container">
    <div class="level-screen">
      <div class="level-header">
        <div class="level-title">Level 4: Tech Stack Architect</div>
        <div class="timer" id="timer">5:00</div>
      </div>
      
      <p style="margin: 20px 0;">Arrange technologies in the correct development stack order (drag and drop):</p>
      
      <div id="draggables" style="margin: 30px 0; min-height: 60px;"></div>
      
      <div class="drop-zone" data-layer="frontend" id="zone1">Frontend Layer</div>
      <div class="drop-zone" data-layer="backend" id="zone2">Backend Layer</div>
      <div class="drop-zone" data-layer="database" id="zone3">Database Layer</div>
      <div class="drop-zone" data-layer="devops" id="zone4">DevOps Layer</div>

      <button class="hint-btn" onclick="showHint()">💡 Request Hint (Cost: 5s)</button>
      <div id="result"></div>
      
      <a href="{{ url_for('level', num=3) }}" class="back-link">← Previous Level</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    generateStars();
    startTimer(300);

    const techStack = {
      'React': 'frontend',
      'Node.js': 'backend',
      'PostgreSQL': 'database',
      'Docker': 'devops'
    };

    // Initialize draggables
    const container = document.getElementById('draggables');
    Object.keys(techStack).forEach((tech, i) => {
      const div = document.createElement('div');
      div.className = 'draggable-item';
      div.draggable = true;
      div.textContent = tech;
      div.id = 'tech' + i;
      div.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text', tech);
      });
      container.appendChild(div);
    });

    // Setup drop zones
    document.querySelectorAll('.drop-zone').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', () => {
        zone.classList.remove('drag-over');
      });
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        const tech = e.dataTransfer.getData('text');
        zone.textContent = zone.dataset.layer + ': ' + tech;
        zone.dataset.placed = tech;
        checkAnswer();
      });
    });

    function showHint() {
      useHint('Think about typical web application architecture: Frontend (user interface) → Backend (server logic) → Database (data storage) → DevOps (deployment & infrastructure).');
    }

    function checkAnswer() {
      const zones = document.querySelectorAll('.drop-zone');
      const allCorrect = Array.from(zones).every(z => {
        return techStack[z.dataset.placed] === z.dataset.layer;
      });
      
      if(allCorrect && Array.from(zones).every(z => z.dataset.placed)) {
        saveProgress(4);
        document.getElementById('result').innerHTML = `
          <div class="result-box">
            <div class="success">✅ ARCHITECTURE VERIFIED</div>
            <div class="resume-section">
              <h3>Projects Portfolio Unlocked</h3>
              <p><strong>Project 1:</strong> E-Commerce Platform</p>
              <p style="margin-left: 20px; color: #a0aec0;">Tech: React, Node.js, PostgreSQL, AWS | 50K+ users</p>
              
              <p><strong>Project 2:</strong> Real-time Analytics Dashboard</p>
              <p style="margin-left: 20px; color: #a0aec0;">Tech: Vue.js, Python, MongoDB | Processing 1M+ events/day</p>
              
              <p><strong>Project 3:</strong> Microservices API Gateway</p>
              <p style="margin-left: 20px; color: #a0aec0;">Tech: Go, Docker, Kubernetes | 99.9% uptime</p>
            </div>
            <a href="{{ url_for('level', num=5) }}" class="action-btn" style="display: inline-block; margin-top: 20px; text-decoration: none;">
              Proceed to Level 5 →
            </a>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
